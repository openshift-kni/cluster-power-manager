apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-role-binding
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: power-manager
roleRef:
  kind: ClusterRole
  name: manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-agent-role-binding
subjects:
- kind: ServiceAccount
  name: node-agent
  namespace: power-manager
roleRef:
  kind: ClusterRole
  name: node-agent-role
  apiGroup: rbac.authorization.k8s.io
