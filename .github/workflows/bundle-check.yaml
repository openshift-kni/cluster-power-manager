name: Bundle Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle-check:
    name: Check generated bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Regenerate and check bundle
        env:
          OCP: "true"
          IMAGE_REGISTRY: quay.io/openshift-kni
          VERSION: "5.1.0"
          BUNDLE_VERSION: "5.1.0"
        run: |
          make bundle
          sed -i '/^[[:space:]]*createdAt:/d' \
            bundle/manifests/cluster-power-manager.clusterserviceversion.yaml
          git add --all --force -- bundle/
          git diff --cached --exit-code -- bundle/
